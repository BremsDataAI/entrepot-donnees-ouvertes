[project]
name = "entrepot-donnees-ouvertes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BremsDataAI", email = "344043925+BremsDataAI@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "dbt-duckdb>=1.11.1",
    "dbt-snowflake>=1.12.5",
    "knoema>=1.3.1",
]

[project.scripts]
entrepot-donnees-ouvertes = "entrepot_donnees_ouvertes:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
